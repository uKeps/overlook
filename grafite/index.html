<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='3' fill='%23F2B48C'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <nav class="nav" id="nav" aria-label="Pages"></nav>
  <span class="time" id="time"></span>
  <button class="btn" data-act="capture">Capture <kbd>C</kbd></button>
</header>
<div class="svcbar" id="svcbar"></div>

<main id="main"></main>

<dialog id="capture">
  <label for="capture-text">Capture to the daily note</label>
  <textarea id="capture-text" rows="3" placeholder="An idea, a link, a question. Enter saves."></textarea>
  <small>Goes to the daily note for <span id="capture-day"></span>. Your agent processes it later.</small>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
