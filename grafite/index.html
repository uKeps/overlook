<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='3' fill='%23F2B48C'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <nav class="nav" id="nav" aria-label="Páginas"></nav>
  <span class="hora" id="hora"></span>
  <button class="btn" data-act="capturar">Capturar <kbd>C</kbd></button>
</header>
<div class="svcbar" id="svcbar"></div>

<main id="main"></main>

<dialog id="cap">
  <label for="capt">Capturar na nota do dia</label>
  <textarea id="capt" rows="3" placeholder="Uma ideia, um link, uma dúvida. Enter salva."></textarea>
  <small>Vai para "Capturei" em <span id="capdia"></span>. O agente processa depois.</small>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
