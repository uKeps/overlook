<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overlook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='5' fill='%23f4b88f'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { document.documentElement.dataset.theme = localStorage.getItem("overlook.theme") || "overlook"; document.documentElement.dataset.ui = localStorage.getItem("overlook.ui") || "minimal"; } catch {}</script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="amb" id="amb1"></div><div class="amb" id="amb2"></div>

<header class="top">
  <div class="crumb"><a href="#/" title="Home"><b>Overlook</b></a><span>/</span><span id="crumb">Home</span></div>
  <div class="svcbar" id="svcbar"></div>
  <div class="clock"><span id="time"></span></div>
  <button class="glass btn search-btn" data-act="cmdk" title="Search notes, pages and actions (/ or Ctrl+K)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span><kbd>/</kbd></button>
  <button class="glass btn ui-btn" data-act="ui-toggle" id="ui-btn" title="Switch interface (V)">Minimal <kbd>V</kbd></button>
  <button class="glass btn cap-btn" data-act="capture" title="Capture to today's note (C)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z"/></svg><span>Capture</span> <kbd>C</kbd></button>
</header>

<section class="cal glass" id="cal" aria-label="Calendar"></section>

<main id="main"></main>

<div class="dockwrap" id="dockwrap"><button type="button" class="dock-pill" id="dock-pill" aria-label="Show the dock"></button><nav class="dock glass" id="dock" aria-label="Pages"></nav></div>

<dialog id="capture" class="glass">
  <div class="dialog-head">
    <div class="seg capture-tabs" role="tablist" aria-label="Capture mode">
      <button type="button" class="on" data-act="capture-tab" data-tab="daily" role="tab" aria-selected="true">Daily Note</button>
      <button type="button" data-act="capture-tab" data-tab="agent" role="tab" aria-selected="false">Note with Agent</button>
    </div>
    <button type="button" class="dialog-close" data-act="capture-close" aria-label="Close">✕</button>
  </div>
  <div class="capture-agent-panel" id="capture-agent-panel" hidden>
    <div class="capture-fields-row capture-agent-row">
      <div class="capture-field">
        <label class="capture-field-label" for="capture-agent">Agent</label>
        <select class="pick" id="capture-agent" aria-label="Agent"></select>
      </div>
      <div class="capture-field" id="capture-model-wrap">
        <label class="capture-field-label" for="capture-model">Model</label>
        <select class="pick" id="capture-model" aria-label="Model" hidden></select>
      </div>
    </div>
    <div class="capture-effort-row" id="capture-effort-row">
      <span class="capture-effort-label">Effort</span>
      <div class="seg" id="capture-effort" role="radiogroup" aria-label="Effort" hidden></div>
    </div>
  </div>
  <textarea id="capture-text" rows="3" placeholder="An idea, a link, a question. Enter saves." aria-label="Capture text"></textarea>
  <div class="capture-foot">
    <small id="capture-hint">Goes to the daily note for <span id="capture-day"></span>. Your agent processes it later.</small>
    <button type="button" class="btn peach" id="capture-submit-btn" data-act="capture-save">Save</button>
  </div>
</dialog>
<dialog id="cmdk" aria-label="Search notes, pages and actions">
  <div class="ck-field"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="cmdk-q" placeholder="Search notes, pages and actions" autocomplete="off" spellcheck="false" aria-controls="cmdk-list"></div>
  <div class="ck-list" id="cmdk-list" role="listbox"></div>
  <div class="ck-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
</dialog>
<dialog id="picker" class="glass" aria-label="Choose an image"></dialog>
<div class="toast glass" id="toast" role="status"></div>

<script type="module" src="/vendor/ascii/ascii.js"></script>
<script src="/app.js"></script>
</body>
</html>
